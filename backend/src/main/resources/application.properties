spring:
  application:
    name: environmental-intelligence-api
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.environmental: DEBUG
    com.google.firebase: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

firebase:
  credentials:
    json: ${FIREBASE_CREDENTIALS_JSON:}